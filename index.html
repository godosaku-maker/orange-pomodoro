<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf5">
<title>Pomodoro 🍊</title>
<style>
:root{--bg:#fffaf5;--orange:#f28a43;--orange2:#ffd5b5;--ink:#59483d;--muted:#a99a8f;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#fff 0,#fffaf5 65%);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:22px 16px calc(22px + env(safe-area-inset-bottom));}
.app{width:min(100%,440px);text-align:center}
.kicker{font-size:11px;letter-spacing:.22em;color:var(--orange);font-weight:800}
h1{font-size:25px;margin:8px 0 5px;letter-spacing:-.04em}
.subtitle{font-size:12px;color:var(--muted);margin:0 0 22px}
.stage{position:relative;height:164px;margin:0 auto 2px;display:flex;align-items:flex-end;justify-content:center;gap:34px;overflow:hidden}
.char{width:104px;height:142px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 5px 3px #d7b9a533);animation:bob 1.05s ease-in-out infinite;transform-origin:50% 90%}
.char.second{animation-delay:.22s}
.char.walk{animation:walk .55s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes walk{from{transform:translateY(2px) rotate(-5deg)}to{transform:translateY(-7px) rotate(5deg)}}
.dots{display:flex;justify-content:center;gap:6px;margin:3px 0 18px}
.dots i{width:5px;height:5px;border-radius:50%;background:#f6c49e}
.panel{background:#fff;border:1px solid #f6e8dc;border-radius:28px;padding:22px 18px 20px;box-shadow:0 12px 35px #9d70400d}
.mode{display:flex;justify-content:center;gap:7px;margin-bottom:17px;flex-wrap:wrap}
.mode button,.actions button,.task button{border:0;font:inherit;cursor:pointer}
.mode button{background:#fff5ed;color:#b77a4d;border-radius:999px;padding:9px 13px;font-size:12px}
.mode button.active{background:var(--orange);color:white;font-weight:750}
.time{font-size:clamp(64px,19vw,82px);font-weight:800;letter-spacing:-.075em;font-variant-numeric:tabular-nums;color:#493c34;line-height:1.1;margin:2px 0 8px}
.status{font-size:12px;color:var(--muted);margin-bottom:17px}
.progress{height:6px;background:#fff0e5;border-radius:99px;overflow:hidden;margin:0 7px 19px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ffc18e,var(--orange));border-radius:99px;transition:width .3s}
.actions{display:flex;justify-content:center;gap:10px}
.actions button{border-radius:999px;padding:13px 24px;font-size:14px;font-weight:750}
#toggle{background:var(--orange);color:white;min-width:132px;box-shadow:0 5px 12px #f28a4330}
#reset{background:#fff3e9;color:#a66d45}
.task{margin-top:15px;display:flex;gap:8px}
.task input{min-width:0;flex:1;border:1px solid #f4e5d9;border-radius:14px;padding:12px 13px;font:inherit;font-size:13px;outline:none;background:#fff}
.task input:focus{border-color:#f3ae7c}
.task button{background:#fff0e5;color:#ad7046;border-radius:14px;padding:0 14px;font-size:12px;font-weight:700}
.stats{display:flex;justify-content:space-around;margin-top:18px;padding-top:15px;border-top:1px solid #f6eee8}
.stats strong{display:block;font-size:19px;color:#6a5140}
.stats span{font-size:10px;color:var(--muted)}
.footer{font-size:10px;color:#c0afa2;margin-top:17px}
@media(max-height:720px){body{align-items:flex-start}.stage{height:125px}.char{height:115px}h1{margin-top:4px}.subtitle{margin-bottom:12px}}
</style>
</head>

      <label>시간 <input id="customMinutes" type="number" inputmode="numeric" min="1" max="180" value="25"></label>
      <label>분</label>
      <button id="applyTime" type="button">시간 적용</button>
    </div>
    <div class="time" id="time">25:00</div>
    <div class="status" id="status">집중할 시간이에요. 천천히 시작해 봐요!</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="actions">
      <button id="toggle">시작하기</button>
      <button id="reset">초기화</button>
    </div>
    <div class="task">
      <input id="task" placeholder="오늘 할 일 적기" maxlength="60" aria-label="오늘 할 일">
      <button id="saveTask">저장</button>
    </div>
    <div class="stats">
      <div><strong id="count">0</strong><span>오늘 집중 횟수</span></div>
      <div><strong id="minutes">0분</strong><span>오늘 집중 시간</span></div>
    </div>
  </section>
  <div class="footer">작은 한 걸음도 충분히 멋져요.</div>
</main>
<script>
const durations={focus:25*60,short:5*60,long:15*60};
const labels={focus:"집중할 시간이에요. 천천히 시작해 봐요!",short:"잠깐 쉬어 가요 ☁️",long:"수고했어요! 푹 쉬어요 🍊"};
let mode="focus",remaining=durations.focus,interval=null,endAt=null;
const $=id=>document.getElementById(id);
const today=new Date().toLocaleDateString("sv-SE");
let saved=JSON.parse(localStorage.getItem("pomodoro-"+today)||'{"count":0,"minutes":0}');
$("count").textContent=saved.count;$("minutes").textContent=saved.minutes+"분";
function render(){
  const m=Math.floor(remaining/60),s=remaining%60;
  $("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  $("status").textContent=labels[mode];
  $("bar").style.width=((durations[mode]-remaining)/durations[mode]*100)+"%";
}
function stop(){
  if(interval)clearInterval(interval);interval=null;endAt=null;
  $("toggle").textContent="계속하기";
  $("char1").classList.remove("walk");$("char2").classList.remove("walk");
}
function tick(){
  remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));render();
  if(remaining===0){
    stop();
    if(mode==="focus"){
      saved.count++;saved.minutes+=Math.round(durations.focus/60);
      localStorage.setItem("pomodoro-"+today,JSON.stringify(saved));
      $("count").textContent=saved.count;$("minutes").textContent=saved.minutes+"분";
    }
    $("status").textContent=mode==="focus"?"집중 완료! 정말 수고했어요 ✨":"휴식이 끝났어요. 다시 천천히 해봐요!";
    $("toggle").textContent="다시 시작";
    $("char1").classList.add("celebrate");$("char2").classList.add("celebrate");
    setTimeout(()=>{$("char1").classList.remove("celebrate");$("char2").classList.remove("celebrate");},2600);
    try{if(navigator.vibrate)navigator.vibrate([120,70,120]);}catch(e){}
  }
}
$("toggle").addEventListener("click",()=>{
  if(interval){stop();return;}
  if(remaining===0)remaining=durations[mode];
  endAt=Date.now()+remaining*1000;
  $("toggle").textContent="일시정지";
  $("char1").classList.add("walk");$("char2").classList.add("walk");
  interval=setInterval(tick,250);render();
});
$("reset").addEventListener("click",()=>{stop();remaining=durations[mode];$("toggle").textContent="시작하기";render();});
document.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{
  stop();mode=btn.dataset.mode;remaining=durations[mode];
  $("customMinutes").value=Math.round(durations[mode]/60);
  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b===btn));
  $("toggle").textContent="시작하기";render();
}));
$("applyTime").addEventListener("click",()=>{
  const mins=Math.max(1,Math.min(180,parseInt($("customMinutes").value,10)||25));
  $("customMinutes").value=mins;
  stop();durations[mode]=mins*60;remaining=durations[mode];
  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  $("toggle").textContent="시작하기";render();
});
$("saveTask").addEventListener("click",()=>{
  localStorage.setItem("pomodoro-task",$("task").value);
  $("saveTask").textContent="저장됨";setTimeout(()=>$("saveTask").textContent="저장",1100);
});
$("task").value=localStorage.getItem("pomodoro-task")||"";
render();
</script>
</body>
</html>
